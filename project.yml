name: macSvn
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    AD_HOC_CODE_SIGNING_ALLOWED: YES
    ENABLE_HARDENED_RUNTIME: NO
    ONLY_ACTIVE_ARCH: YES

targets:
  SVN访达菜单:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.svnfindermenu
        PRODUCT_NAME: SVN访达菜单
        EXECUTABLE_NAME: SVN访达菜单
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        GENERATE_INFOPLIST_FILE: false
    dependencies:
      - target: SVNFinderSync
        embed: true
        copy:
          destination: plugins
          codeSign: true

  SVNFinderSync:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderSync
      - path: Shared
        excludes:
          - OperationLog.swift
          - SVNStatusParser.swift
    dependencies:
      - sdk: FinderSync.framework
      - sdk: AppKit.framework
      - sdk: Cocoa.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.svnfindermenu.FinderSync
        PRODUCT_NAME: SVNFinderSync
        PRODUCT_MODULE_NAME: SVNFinderSync
        INFOPLIST_FILE: FinderSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderSync/FinderSync.entitlements
        SKIP_INSTALL: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        GENERATE_INFOPLIST_FILE: false
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
